name: Vérification Lot A
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CHKPT_CODEX_GITHUB_PRET_A_IMPORTER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CHKPT_CODEX_GITHUB_PRET_A_IMPORTER/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Vérifier le parcours et publier le diagnostic en cas d'échec
        run: |
          python3 - <<'PYTHON'
          import subprocess, sys
          result = subprocess.run(['npm', 'run', 'test:browser'], text=True, capture_output=True)
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          if result.returncode:
              detail = (result.stderr or result.stdout)[-3500:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + detail)
          sys.exit(result.returncode)
          PYTHON
