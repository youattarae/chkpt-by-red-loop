name: Vérification Lot A
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CHKPT_CODEX_GITHUB_PRET_A_IMPORTER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CHKPT_CODEX_GITHUB_PRET_A_IMPORTER/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
